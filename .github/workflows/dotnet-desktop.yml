# Build ZorkDotNet as Native AOT executables for Windows, macOS, and Linux.
# Native AOT compiles with the platform's own toolchain, so each OS publishes on its own runner.
# linux-arm (32-bit) is not supported by Native AOT and is published trimmed single-file instead.
# Mac and Linux executables are named "zork"; Windows remains "Zork.exe".
# On push to main: lint, test, publish, upload artifacts. On tag v* or manual run: create a GitHub Release.

name: Build and test

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (tag will be v<version>, e.g. 1.0.0 → v1.0.0)"
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"

      - name: Lint (formatting, code style, analyzers)
        run: dotnet format ZorkDotNet.sln --verify-no-changes --verbosity diagnostic

      - name: Run tests
        run: dotnet test ZorkDotNet.sln -c Release --verbosity normal

  publish:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: windows-latest, aot: true }
          - { rid: win-arm64, os: windows-latest, aot: true }
          - { rid: linux-x64, os: ubuntu-latest, aot: true }
          - { rid: linux-arm64, os: ubuntu-24.04-arm, aot: true }
          - { rid: linux-arm, os: ubuntu-latest, aot: false }
          - { rid: osx-x64, os: macos-latest, aot: true }
          - { rid: osx-arm64, os: macos-latest, aot: true }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"

      - name: Install Native AOT prerequisites (Linux)
        if: runner.os == 'Linux' && matrix.aot
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish Native AOT
        if: matrix.aot
        shell: bash
        run: dotnet publish ZorkDotNet/ZorkDotNet.csproj -c Release -r ${{ matrix.rid }} -o out

      - name: Publish trimmed single-file (no Native AOT for this target)
        if: ${{ !matrix.aot }}
        shell: bash
        run: |
          dotnet publish ZorkDotNet/ZorkDotNet.csproj -c Release -r ${{ matrix.rid }} \
            -p:PublishAot=false \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:PublishTrimmed=true \
            -o out

      - name: Collect executable
        shell: bash
        run: |
          mkdir -p release/${{ matrix.rid }}
          if [ -f out/Zork.exe ]; then
            cp out/Zork.exe release/${{ matrix.rid }}/
          else
            cp out/Zork release/${{ matrix.rid }}/zork
          fi
          ls -la release/${{ matrix.rid }}

      - name: Smoke test
        if: matrix.rid == 'win-x64' || matrix.rid == 'linux-x64' || matrix.rid == 'linux-arm64' || matrix.rid == 'osx-arm64'
        shell: bash
        run: |
          exe=$(ls release/${{ matrix.rid }}/*)
          printf 'NORTH\nSCORE\n' | "$exe" | tee smoke.txt
          grep -q "north side of a white house" smoke.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: release

  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - name: Create ZorkDotNet-<target>.zip for each platform
        run: |
          for dir in win-x64 win-arm64 linux-x64 linux-arm64 linux-arm osx-x64 osx-arm64; do
            name="ZorkDotNet-${dir}.zip"
            if [ -f "release/$dir/Zork.exe" ]; then
              (cd "release/$dir" && zip -q "$name" Zork.exe)
            else
              chmod +x "release/$dir/zork"
              (cd "release/$dir" && zip -q "$name" zork)
            fi
            mv "release/$dir/$name" .
          done
          ls -la ZorkDotNet-*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || github.ref_name }}
          generate_release_notes: true
          files: |
            ZorkDotNet-win-x64.zip
            ZorkDotNet-win-arm64.zip
            ZorkDotNet-linux-x64.zip
            ZorkDotNet-linux-arm64.zip
            ZorkDotNet-linux-arm.zip
            ZorkDotNet-osx-x64.zip
            ZorkDotNet-osx-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
